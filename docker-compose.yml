services:
  omnimail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnimail-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set APP_SECRET_KEY to a private value of 32+ characters}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - APP_ENCRYPTION_KEYS_PREVIOUS=${APP_ENCRYPTION_KEYS_PREVIOUS:-}
      - NEXT_PUBLIC_APP_URL="http://localhost:3000"
    networks:
      - coolify

networks:
  coolify:
    external: true
